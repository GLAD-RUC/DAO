fold: 0
root_path: ${oc.env:PROJECT_ROOT}/data/super_conductors/supercon3d/fold_${data.fold}
pretrain: False
prop: logtc  #formation_energy_per_atom
num_targets: 1
# prop: scaled_lattice
# num_targets: 6
niggli: true
primitive: False
graph_method: crystalnn
lattice_scale_method: scale_length
preprocess_workers: 30
readout: mean

max_atoms: 200     ## 20 -> 200, follow SODNet
otf_graph: false
eval_model_name: supercon3d
tolerance: 0.1

use_space_group: false
use_pos_index: false
train_max_epochs: 1000
early_stopping_patience: 100000
teacher_forcing_max_epoch: 500


datamodule:
  _target_: dao.pl_data.datamodule.CrystDataModule

  datasets:
    train:
      _target_: dao.pl_data.dataset.CrystDataset
      name: logtc train
      path: ${data.root_path}/train.csv
      save_path: ${data.root_path}/train_ori.pt
      prop: ${data.prop}
      niggli: ${data.niggli}
      primitive: ${data.primitive}
      graph_method: ${data.graph_method}
      tolerance: ${data.tolerance}
      use_space_group: ${data.use_space_group}
      use_pos_index: ${data.use_pos_index}
      lattice_scale_method: ${data.lattice_scale_method}
      preprocess_workers: ${data.preprocess_workers}

    test:
      - _target_: dao.pl_data.dataset.CrystDataset
        name: logtc val
        path: ${data.root_path}/val.csv
        save_path: ${data.root_path}/val_ori.pt
        prop: ${data.prop}
        niggli: ${data.niggli}
        primitive: ${data.primitive}
        graph_method: ${data.graph_method}
        tolerance: ${data.tolerance}
        use_space_group: ${data.use_space_group}
        use_pos_index: ${data.use_pos_index}
        lattice_scale_method: ${data.lattice_scale_method}
        preprocess_workers: ${data.preprocess_workers}

  num_workers:
    train: 0
    val: 0
    test: 0


  batch_size: 
    train: 80
    val: 80
    test: 80
