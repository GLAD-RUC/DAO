root_path: ${oc.env:PROJECT_ROOT}/data/scaling_data/full
# prop: formation_energy_per_atom  ## mp_20
prop: stability   ## mp_oqmd, unstable_oqmd, scaling_data_new
# prop: e_above_hull  ## mp_database
num_targets: 1
# prop: scaled_lattice
# num_targets: 6
niggli: true
primitive: False
graph_method: crystalnn
lattice_scale_method: scale_length
preprocess_workers: 30
readout: mean
max_atoms: 30
otf_graph: false
eval_model_name: pretrain
tolerance: 0.1

use_space_group: false
use_pos_index: false
train_max_epochs: 1000
early_stopping_patience: 100000
teacher_forcing_max_epoch: 500


datamodule:
  _target_: diffcsp.pl_data.datamodule.CrystDataModule

  datasets:
    train:
      _target_: diffcsp.pl_data.dataset.CrystDataset
      name: strucure train
      path: ${data.root_path}/stable.csv
      save_path: ${data.root_path}/dedup_final.pt
      prop: ${data.prop}
      niggli: ${data.niggli}
      primitive: ${data.primitive}
      graph_method: ${data.graph_method}
      tolerance: ${data.tolerance}
      use_space_group: ${data.use_space_group}
      use_pos_index: ${data.use_pos_index}
      lattice_scale_method: ${data.lattice_scale_method}
      preprocess_workers: ${data.preprocess_workers}
      # transform_prop: False


  num_workers:
    train: 0
    val: 0
    test: 0

  batch_size:
    train: 1024
    val: 1024
    test: 1024